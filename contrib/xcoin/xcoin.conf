# X Coin package defaults. Double-click reads this file automatically.
# Nifty Raven (@NFTRVN on X)
#
# Do not invent values. Leave addnode and xoauthclientid commented
# until the operator fills them. There are no public DNS seeds.

listen=1
dnsseed=0

# Launch-night seed. Opening the real wallet starts the first node
# (P2P 38443). After it is running, Home → Provide my node IP shows
# the address others must use. Put ONE line here in the public
# Windows and Linux packages, then open the GitHub repo. Users do
# not edit a conf file and do not use a terminal.
# addnode=<host>:38443

# Operator X app Client ID (not a user paste field).
# Callback must be exactly: http://127.0.0.1:18791/callback
# Uncomment and put the real Client ID after the equals sign when
# you have one. Do not invent a Client ID. Empty → Sign in says
# the operator has not baked one.
# xoauthclientid=
